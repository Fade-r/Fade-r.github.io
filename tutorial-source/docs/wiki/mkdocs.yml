site_name: 毫米波雷达教程
site_description: FMCW 雷达发射、接收、采集与信号处理，附 MATLAB 和 Python 示例
site_author: codex-radar research workspace
docs_dir: content
site_dir: site
use_directory_urls: false
strict: true

theme:
  name: material
  custom_dir: overrides
  language: zh
  font: false
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight
    - search.share
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: 切换至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: 切换至浅色模式

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/theme-toggle.js
  - assets/javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

nav:
  - 简介: index.md
  - 发射与接收:
      - 发射信号: foundations/transmit.md
      - 回波与混频: foundations/echo-and-mixing.md
      - I/Q 与采样: foundations/sampling.md
  - 数据采集与读取:
      - 雷达与数据采集: data/capture.md
      - 帧、通道与数组: orientation/learning-path.md
      - ADC 数据读取: data/adc-iq-layout.md
  - 信号处理:
      - FFT 与频谱: foundations/signal-and-fft.md
      - 距离测量: processing/range.md
      - 速度测量: processing/doppler.md
      - 目标检测: practice/detection.md
      - 角度测量: processing/angle.md
      - 微位移测量: processing/phase.md
      - 完整处理示例: practice/end-to-end.md
  - 项目案例:
      - 项目参数对照: orientation/parameters-and-shapes.md
      - 项目代码分析: code/code-map.md
      - 原函数逐段说明: code/original-functions.md
      - 实测结果分析: audit/scientific-audit.md
      - 诊断图说明: reference/figure-atlas.md
      - 实验验证: audit/validation-roadmap.md
  - 参考资料:
      - MATLAB/Python 语法速查: foundations/arrays-and-languages.md
      - 代码来源和参考资料: reference/sources.md

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: relative_to_docs
    unrecognized_links: warn

copyright: 毫米波雷达教程 · MATLAB / Python
