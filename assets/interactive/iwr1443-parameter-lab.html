  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);

  left: 0;
  width: 16px;
  height: 16px;

  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));

  &lt;style&gt;
    #iwr1443-parameter-lab {
      display: grid;
      gap: 1rem;
      width: 100%;
      color: var(--foreground);
    }
    #iwr1443-parameter-lab .viz-controls {

      display: grid;

      display: block;

    }

    #iwr1443-parameter-lab .radar-tick {
      stroke: var(--border);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }
    #iwr1443-parameter-lab .radar-series-one {
      stroke: var(--viz-series-1);
      stroke-width: 4;
      fill: none;
      vector-effect: non-scaling-stroke;
    }
    #iwr1443-parameter-lab .radar-series-two {
      stroke: var(--viz-series-2);
      stroke-width: 4;
      fill: none;
      vector-effect: non-scaling-stroke;
    }
    #iwr1443-parameter-lab .radar-guide {
      stroke: var(--muted-foreground);
      stroke-width: 2;
      stroke-dasharray: 4 4;
      vector-effect: non-scaling-stroke;
    }
    #iwr1443-parameter-lab .radar-marker-one {
      fill: var(--viz-series-1);
      stroke: var(--background);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }
    #iwr1443-parameter-lab .radar-marker-two {
      fill: var(--viz-series-2);
      stroke: var(--background);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }
    #iwr1443-parameter-lab .radar-label {
      fill: var(--foreground);
      font-size: var(--font-size-base);
      font-weight: 400;
    }
    @media (max-width: 560px) {
      #iwr1443-parameter-lab .radar-lab-plots {
        grid-template-columns: 1fr;
      }

    @media (prefers-reduced-motion: no-preference) {
      #iwr1443-parameter-lab .radar-series-two,
      #iwr1443-parameter-lab .radar-marker-one,

        transition: all 180ms ease;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;iwr1443-parameter-lab&#x27;);
      if (!root) return;

      const c = 3e8;
      const slope = 29.982e12;
      const fs = 10e6;
      const samples = 256;
      const loops = 128;
      const tc = 160e-6;
      const centerFrequency = 77e9 + (slope * 60e-6) / 2;
      const wavelength = c / centerFrequency;
      const rangeResolution = c * fs / (2 * slope * samples);
      const rangePeriod = rangeResolution * samples;

      const rangeInput = root.querySelector(&#x27;#radar-range&#x27;);
      const speedInput = root.querySelector(&#x27;#radar-speed&#x27;);
      const priInput = root.querySelector(&#x27;#radar-pri-model&#x27;);

      const clamp = (value, min, max) =&gt; Math.min(max, Math.max(min, value));
      const formatSigned = (value, digits) =&gt; `${value &gt;= 0 ? &#x27;+&#x27; : &#x27;−&#x27;}${Math.abs(value).toFixed(digits)}`;

      function update() {
        const rangeM = Number(rangeInput.value);
        const speedMps = Number(speedInput.value);
        const multiplier = Number(priInput.value);
        const slowTime = tc * multiplier;
        const delayS = 2 * rangeM / c;
        const dopplerHz = 2 * speedMps / wavelength;
        const beatHz = 2 * slope * rangeM / c + dopplerHz;
        const rangeBin = beatHz / (fs / samples);
        const velocityResolution = wavelength / (2 * loops * slowTime);
        const velocityMax = wavelength / (4 * slowTime);
        const dopplerBin = speedMps / velocityResolution;

        root.querySelector(&#x27;#radar-range-value&#x27;).textContent = `${rangeM.toFixed(1)} m`;
        root.querySelector(&#x27;#radar-speed-value&#x27;).textContent = `${formatSigned(speedMps, 2)} m/s`;
        root.querySelector(&#x27;#radar-beat-stat&#x27;).textContent = `${(beatHz / 1e6).toFixed(3)} MHz`;
        root.querySelector(&#x27;#radar-range-bin-stat&#x27;).textContent = `距离 bin ${rangeBin.toFixed(1)}`;
        root.querySelector(&#x27;#radar-doppler-bin-stat&#x27;).textContent = `Doppler bin ${formatSigned(dopplerBin, 1)}`;
        root.querySelector(&#x27;#radar-velocity-axis-stat&#x27;).textContent = `Δv = ${velocityResolution.toFixed(3)} m/s`;

        const beatOffset = clamp(10 + Math.abs(beatHz) / 1.3e6 * 54, 10, 68);
        const rxLine = root.querySelector(&#x27;#radar-rx-line&#x27;);
        rxLine.setAttribute(&#x27;y1&#x27;, String(170 + beatOffset));
        rxLine.setAttribute(&#x27;y2&#x27;, String(38 + beatOffset));
        root.querySelector(&#x27;#radar-rx-label&#x27;).setAttribute(&#x27;y&#x27;, String(63 + beatOffset));
        root.querySelector(&#x27;#radar-beat-guide&#x27;).setAttribute(&#x27;y2&#x27;, String(103 + beatOffset));
        root.querySelector(&#x27;#radar-delay-label&#x27;).textContent = `τ = ${(delayS * 1e9).toFixed(1)} ns · 延迟已放大显示`;
        root.querySelector(&#x27;#radar-beat-label&#x27;).textContent = `fb = ${(beatHz / 1e6).toFixed(3)} MHz`;

        const rangeX = 28 + clamp(rangeM / rangePeriod, 0, 1) * 304;
        root.querySelector(&#x27;#radar-range-marker&#x27;).setAttribute(&#x27;cx&#x27;, String(rangeX));
        root.querySelector(&#x27;#radar-range-marker-label&#x27;).setAttribute(&#x27;x&#x27;, String(rangeX));
        root.querySelector(&#x27;#radar-range-marker-label&#x27;).textContent = `${rangeM.toFixed(1)} m`;

        const speedX = 28 + clamp((speedMps + velocityMax) / (2 * velocityMax), 0, 1) * 304;
        root.querySelector(&#x27;#radar-speed-marker&#x27;).setAttribute(
          &#x27;d&#x27;,
          `M ${speedX} 174 L ${speedX + 8} 184 L ${speedX} 194 L ${speedX - 8} 184 Z`,
        );
        root.querySelector(&#x27;#radar-speed-marker-label&#x27;).setAttribute(&#x27;x&#x27;, String(speedX));
        root.querySelector(&#x27;#radar-speed-marker-label&#x27;).textContent = formatSigned(speedMps, 2);
        root.querySelector(&#x27;#radar-vmin-label&#x27;).textContent = `−${velocityMax.toFixed(2)} m/s`;
        root.querySelector(&#x27;#radar-vmax-label&#x27;).textContent = `+${velocityMax.toFixed(2)} m/s`;

        const modelLabel = multiplier === 3 ? &#x27;3TX 慢时间采用 480 µs&#x27; : &#x27;教程慢时间采用 160 µs&#x27;;
        const auditLabel = multiplier === 3
          ? &#x27;速度范围是教程 Tc 轴的三分之一。&#x27;
          : &#x27;这复现当前代码坐标，但遗漏 3TX 重访因子。&#x27;;
        root.querySelector(&#x27;#radar-lab-detail&#x27;).textContent = `${modelLabel}: ${auditLabel}`;
      }

      rangeInput.addEventListener(&#x27;input&#x27;, update);
      speedInput.addEventListener(&#x27;input&#x27;, update);
      priInput.addEventListener(&#x27;change&#x27;, update);
      update();
    })();
  &lt;/script&gt;
&lt;/section&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
